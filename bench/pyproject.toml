[project]
name = "argdantic-bench"
version = "0.0.0"
description = "Accuracy benchmark for argdantic (not published)."
requires-python = ">=3.11"
dependencies = ["argdantic"]

[tool.uv.sources]
argdantic = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
