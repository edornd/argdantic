[project]
name = "twofold"
version = "0.0.1"
description = "Typed Python CLIs that serve humans and agents from one signature."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edoardo Arnaudo", email = "edoardo.arn@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.15.0"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/edornd/twofold"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.uv.workspace]
members = ["bench"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
