site_name: argdantic
site_description: Typed Python CLIs that serve humans and agents from one signature.
repo_url: https://github.com/edornd/argdantic
theme:
  name: material
  features:
    - content.code.copy
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Commands: commands.md
  - Errors and exit codes: errors.md
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
